{% extends "surveys/base.html" %}
{% load static %}

{% block title %}Темы{% endblock %}

{% block content %}

<div class="topics-wrapper">

    <h2 class="topics-title">Темы</h2>

    <div class="topic-grid">
        {% for topic in topics %}
            <a href="/topics/{{ topic.id }}/" class="topic-card">
                <div class="topic-image">
                    <img src="{% static 'surveys/img/topics/' %}{{ topic.image }}" alt="{{ topic.name }}">
                </div>
                <div class="topic-title">{{ topic.name }}</div>
            </a>
        {% endfor %}
    </div>

</div>

{% endblock %}
