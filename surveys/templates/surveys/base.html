<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Опросы{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4a6cf7;
            color: white;
            padding: 15px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        main {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<header>
    <h1>Платформа опросов</h1>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    Курсовая работа · Бэкенд Разработка<br>
    ИКБО-12-23 · Копий И.В
</footer>

</body>
</html>
