{% extends "surveys/base.html" %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
<h2>Редактирование профиля</h2>

<form method="post">
    {% csrf_token %}

    <label>Пол:</label><br>
    <select name="gender" required>
        <option value="male" {% if profile.gender == "male" %}selected{% endif %}>Мужской</option>
        <option value="female" {% if profile.gender == "female" %}selected{% endif %}>Женский</option>
        <option value="other" {% if profile.gender == "other" %}selected{% endif %}>Другое</option>
    </select><br><br>

    <label>Страна:</label><br>
    <input type="text" name="country" value="{{ profile.country }}" required><br><br>

    <label>Возраст:</label><br>
    <input type="number" name="age" value="{{ profile.age }}" min="1" max="120" required><br><br>

    <button type="submit">Сохранить</button>
</form>

{% endblock %}
